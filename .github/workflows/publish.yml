name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run npm publish with --dry-run only'
        required: false
        default: 'false'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: install
        run: npm ci

      - name: verify tag matches package versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "tag (stripped) = $TAG"
          for PKG in packages/tracklution packages/create-tracklution packages/at-tracklution-cli packages/tracklution-mcp packages/server-side-tracking packages/conversion-tracking packages/conversion-api; do
            V=$(node -p "require('./$PKG/package.json').version")
            echo "$PKG -> $V"
            if [ "$V" != "$TAG" ]; then
              echo "::error::$PKG version $V does not match tag $TAG. Bump all four packages in lockstep before tagging."
              exit 1
            fi
          done

      - name: lint
        run: npm run lint

      - name: test
        env:
          PARITY_TEST_SKIP: '1'
        run: npm test

      - name: publish tracklution (canonical)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            npm publish --workspace tracklution --provenance --access public --dry-run
          else
            npm publish --workspace tracklution --provenance --access public
          fi

      - name: publish create-tracklution
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            npm publish --workspace create-tracklution --provenance --access public --dry-run
          else
            npm publish --workspace create-tracklution --provenance --access public
          fi

      - name: publish @tracklution/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            npm publish --workspace @tracklution/cli --provenance --access public --dry-run
          else
            npm publish --workspace @tracklution/cli --provenance --access public
          fi

      - name: publish tracklution-mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            npm publish --workspace tracklution-mcp --provenance --access public --dry-run
          else
            npm publish --workspace tracklution-mcp --provenance --access public
          fi

      - name: publish server-side-tracking
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            npm publish --workspace server-side-tracking --provenance --access public --dry-run
          else
            npm publish --workspace server-side-tracking --provenance --access public
          fi

      - name: publish conversion-tracking
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            npm publish --workspace conversion-tracking --provenance --access public --dry-run
          else
            npm publish --workspace conversion-tracking --provenance --access public
          fi

      - name: publish conversion-api
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            npm publish --workspace conversion-api --provenance --access public --dry-run
          else
            npm publish --workspace conversion-api --provenance --access public
          fi
