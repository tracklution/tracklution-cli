name: mcp-registry
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PUBLISHER_VERSION: v1.8.1
      PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@v4
      - name: install mcp-publisher (pinned)
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
      - name: login (DNS, tracklution.com apex TXT)
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: ./mcp-publisher login dns --domain tracklution.com --private-key "$MCP_REGISTRY_PRIVATE_KEY"
      - name: publish server.json
        run: ./mcp-publisher publish
      - name: assert the registry serves the new version with remotes
        run: |
          VERSION=$(jq -r .version server.json)
          for i in 1 2 3 4 5; do
            if curl -fsS -m 20 'https://registry.modelcontextprotocol.io/v0/servers/com.tracklution%2Fserver-side-tracking/versions/latest' \
              | jq -e --arg v "$VERSION" '.server.version == $v and .server.remotes[0].url == "https://mcp.tracklution.com/mcp"'; then exit 0; fi
            sleep 10
          done
          exit 1
