name: release-please

# When release-please is configured with the default GITHUB_TOKEN, the tag it
# pushes will NOT trigger the publish.yml workflow (GitHub Actions blocks this
# to prevent recursive workflow runs from GITHUB_TOKEN-driven events). To make
# the tag → publish chain automatic, create a fine-grained PAT with
#   - Contents: read & write
#   - Pull requests: read & write
#   - Workflows: read & write
# scoped to this repo, store it as the `RELEASE_PLEASE_TOKEN` repo secret, and
# release-please will use it. Without that secret, you must manually invoke the
# publish workflow via `gh workflow run publish.yml` after merging each
# release-please PR. See:
#   https://github.com/googleapis/release-please-action#github-credentials

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
