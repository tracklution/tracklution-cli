<svg xmlns="http://www.w3.org/2000/svg" width="200" height="20" role="img" aria-label="MCP: 2025-11-25 compliant">
  <title>MCP: 2025-11-25 compliant</title>
  <linearGradient id="bg" x2="0" y2="100%">
    <stop offset="0" stop-opacity=".1" stop-color="#bbb"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="r"><rect width="200" height="20" rx="3"/></clipPath>
  <g clip-path="url(#r)">
    <rect width="50" height="20" fill="#555"/>
    <rect x="50" width="150" height="20" fill="#0ea5a5"/>
    <rect width="200" height="20" fill="url(#bg)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">
    <text x="25" y="14">MCP</text>
    <text x="125" y="14">2025-11-25 compliant</text>
  </g>
</svg>
